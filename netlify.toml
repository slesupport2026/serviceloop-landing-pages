# Netlify configuration for serviceloop-landing-pages.
#
# Deliberately no [build] block — the site's existing publish settings in the
# Netlify UI stay exactly as they are.

# ── /FAQs ────────────────────────────────────────────────────────────────
# The password gate is OFF for now (Clay's call, Oct 2026 — team access first,
# security later). The edge function is parked, working and tested, in
# netlify/edge-functions-disabled/. To turn it back on: move that folder back
# to netlify/edge-functions/, set the FAQ_PASSWORD env var, redeploy. Nothing
# else needs changing.
#
# While it's open, these headers keep the page UNLISTED rather than published:
# anyone with the link can read it, but search engines won't index or cache it.
# The page contains $1M+ Offers curriculum and Salesbot DNA, so being absent
# from Google matters even while the password is off.
[[headers]]
  for = "/FAQs/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
